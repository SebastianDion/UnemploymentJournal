name: unemployementjournal
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  fonts:
  - family: AzeretMono
    fonts:
      - asset: assets/fonts/AzeretMono-Regular.otf
      - asset: assets/fonts/AzeretMono-Bold.otf
        weight: 700
      - asset: assets/fonts/AzeretMono-Light.otf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.jpg"